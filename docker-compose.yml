version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: railway_crew_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: RAILWAY1234
      POSTGRES_DB: railway_crew_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railway_crew_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:RAILWAY1234@db:5432/railway_crew_system
      SECRET_KEY: your-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
